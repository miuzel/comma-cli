[package]
name = "comma"
version = "0.28.0-alpha"
edition = "2024"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crossterm = "0.28"
rustyline = "15"
rust-i18n = "3"

# Unix only; already in the dependency graph (crossterm/rustyline/rustls pull it
# in), so this adds no new crate and no measurable binary size. Used by the
# pty capture path in src/pty.rs: posix_openpt/ioctl/termios/setsid/poll.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
